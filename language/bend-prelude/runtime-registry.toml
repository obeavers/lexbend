# Each Bend name is qualified by the alias the emitted file imports Runtime.bend
# under; names of LexLean.bend carry its own alias (`L.`) inside Runtime.bend.
# `instance` names the monomorphized instance (empty for a non-class constant);
# `A.B` for checkedConvert is source A, target B.

