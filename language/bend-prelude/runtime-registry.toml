[[representation]]
lean = "Nat"
bend = "Nat"
note = "Base unary Nat (Zero/Succ), as in LexLean.bend. The checker evaluates it in unary: a closed value past about 30000 overflows its stack, so fixed-width integers never go through Nat in closed computations."

[[representation]]
lean = "Int"
bend = "L.Lean.Int"
note = "LexLean.bend's Lean.Int: ofNat{n} / negSucc{n}, Lean's own representation."

[[representation]]
lean = "Bool"
bend = "Bool"
note = "Base Bool."

[[representation]]
lean = "Option A"
bend = "Maybe<&2, A>"
note = "Base Maybe: none = None{}, some x = Some{x}."

[[representation]]
lean = "Except E A"
bend = "Result<&2, &2, E, A>"
note = "Base Result: Except.error e = Fail{e}, Except.ok x = Done{x}."

[[representation]]
lean = "Ordering"
bend = "Cmp"
note = "Base Cmp: lt = LT{}, eq = EQ{}, gt = GT{}."

[[representation]]
lean = "Prod A B"
bend = "L.Lean.Prod(A, B)"
note = "Sigma<&2, &2, A, _ => B>; a pair is (a, b)."

[[representation]]
lean = "List A"
bend = "List<&2, A>"
note = "Base List at quantity &2."

[[representation]]
lean = "Char"
bend = "Char"
note = "Base Char, Chr{code: U32}. Lean's Char is a Unicode scalar value; Base admits every U32 code, so a Bend Char may be a surrogate or exceed U+10FFFF, which no Lean Char is. The runtime functions accept such codes and apply Lean's formulas to them unchanged."

[[representation]]
lean = "String"
bend = "String"
note = "Base String, SNil{} / SCon{head: Char, tail: String}: the list of characters (Lean's String.data)."

[[representation]]
lean = "ByteArray"
bend = "Lean.ByteArray"
note = "One-field wrapper Lean.ByteArray.mk{data: List<&2, Lean.UInt8>}: the byte list (Lean wraps Array UInt8; Array is its list)."

[[representation]]
lean = "UInt8"
bend = "Lean.UInt8"
note = "Lean.UInt8.mk{bits: Word(8n)}: exactly 2^8 values. Literal n <= 4294967295: Lean.UInt8.lit(n) with n a U32 literal (n mod 2^8)."

[[representation]]
lean = "UInt16"
bend = "Lean.UInt16"
note = "Lean.UInt16.mk{bits: Word(16n)}: exactly 2^16 values. Literal: Lean.UInt16.lit(n)."

[[representation]]
lean = "UInt32"
bend = "U32"
note = "Base U32 (U32{data: Word(32n)}): exactly 2^32 values; a Bend U32 literal is a UInt32 literal, and Lean.UInt32.lit(n) is the identity."

[[representation]]
lean = "UInt64"
bend = "Lean.UInt64"
note = "Lean.UInt64.mk{bits: Word(64n)}: exactly 2^64 values. Literal n <= 4294967295: Lean.UInt64.lit(n); larger: Lean.UInt64.lit2(hi, lo) for n = hi * 2^32 + lo."

[[representation]]
lean = "Int8"
bend = "Lean.Int8"
note = "Lean.Int8.mk{bits: Word(8n)}, read in two's complement: exactly 2^8 values. (-k : Int8) is Lean.Int8.neg(Lean.Int8.lit(k)), as Lean elaborates it."

[[representation]]
lean = "Int16"
bend = "Lean.Int16"
note = "Lean.Int16.mk{bits: Word(16n)}, two's complement: exactly 2^16 values."

[[representation]]
lean = "Int32"
bend = "Lean.Int32"
note = "Lean.Int32.mk{bits: Word(32n)}, two's complement: exactly 2^32 values."

[[representation]]
lean = "Int64"
bend = "Lean.Int64"
note = "Lean.Int64.mk{bits: Word(64n)}, two's complement: exactly 2^64 values. Literals as for UInt64 (lit, lit2), negated by Lean.Int64.neg."

[[representation]]
lean = "Prop"
bend = "Type"
note = "A Lean Prop is a Bend Type; True is Unit and True.intro is Unit{}; a /\\ b is a & b."

[[representation]]
lean = "instance [Key κ]"
bend = "LexLeanCollections.Key"
note = "The Key instances form a closed universe, defunctionalized into the Data code LexLeanCollections.Key (one constructor per atomic instance, Key.Prod{fst, snd} for Prod). <f>.Key takes the code; <f>.<Instance> is the monomorphized def; <f>.Prod takes the two component codes first."

[[unported]]
lean = "LexLeanCollections.listFold"
reason = "A higher-order fold applies its closure argument once per element; Bend closures are affine and templates are outside the proved kernel. Expressible per call site: the backend lambda-lifts the step into a top-level def over the captured Data and emits a first-order fold (defunctionalization with a closed code type per module)."
bend_error = "step (consumed more than once)"

[[unported]]
lean = "LexLeanCollections.setFold"
reason = "As listFold (setFold step initial set = set.foldl step initial)."
bend_error = "step (consumed more than once)"

[[unported]]
lean = "LexLeanCollections.mapFold"
reason = "As listFold, with a three-argument step."
bend_error = "step (consumed more than once)"

[[unported]]
lean = "LexLeanCollections.iterate"
reason = "Applies its closure argument once per iteration."
bend_error = "step (consumed more than once)"

[[unported]]
lean = "LexLeanCollections.iterateUntil"
reason = "Applies its closure argument once per iteration."
bend_error = "step (consumed more than once)"

[[unported]]
lean = "LexLeanReasoning.starPreserves"
reason = "The proof applies the hypothesis h (a function) at every Star.tail and passes it to the recursive call; a function-typed hypothesis is affine. Without @unsafe the recursion is also refused because the index b changes before hs shrinks."
bend_error = "h (consumed more than once); without @unsafe: a decreasing self-call (arguments are read left to right: each passed unchanged until one shrinks)"

[[unported]]
lean = "LexLeanReasoning.foldInvariant"
reason = "Its statement names LexLeanCollections.listFold, which has no Bend def, and its proof applies the hypothesis h at every element."
bend_error = "listFold: step (consumed more than once)"

