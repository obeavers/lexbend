spec = "lexlean/bend-prelude/1"
module = "LexLean.bend"
imports = ["Base"]

# Bend spellings of the core connectives. A placeholder is exactly `{NAME}`
# for a NAME listed in `[core.holes]`; every other character is literal and
# copied as written. Holes are parenthesised and every result is closed, so
# templates nest without precedence analysis.
[core]
eq = "{({L}) == ({R}) : ({T})}"
and = "(({A}) & ({B}))"
or = "Either<&1, &1, ({A}), ({B})>"
not = "(({A}) -> Empty)"
iff = "((({A}) -> ({B})) & (({B}) -> ({A})))"
exists = "(&{x}: ({A}) -> ({P}))"

[core.holes]
eq = ["L", "R", "T"]
and = ["A", "B"]
or = ["A", "B"]
not = ["A"]
iff = ["A", "B"]
exists = ["x", "A", "P"]

# Literal spellings. `{M}` is the alias the emitted file imports this
# module under; a negative Int `-(k + 1)` is spelled with K = k.
[literal]
nat = "{N}n"
int_nonneg = "{M}.ofNat{{N}n}"
int_negsucc = "{M}.negSucc{{K}n}"

[literal.holes]
nat = ["N"]
int_nonneg = ["M", "N"]
int_negsucc = ["M", "K"]

